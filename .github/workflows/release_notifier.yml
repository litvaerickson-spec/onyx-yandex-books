name: Telegram Release Notifier

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secrets TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID are not set. Skipping notification."
            exit 0
          fi

          MESSAGE="🚀 *Вышло обновление: ${RELEASE_TITLE:-$TAG_NAME}* ($TAG_NAME)%0A%0A"
          MESSAGE+="📋 *Что нового:*%0A${RELEASE_NOTES}%0A%0A"
          MESSAGE+="📦 [Скачать свежий APK на GitHub]($RELEASE_URL)%0A%0A"
          MESSAGE+="🔄 *Обновление по воздуху:* ридеры обновятся в 1 клик при проверке обновлений в меню читалки."

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=false"
