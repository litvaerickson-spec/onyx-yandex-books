plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onyx.yandexbooks'
    compileSdk 30

    defaultConfig {
        applicationId "com.onyx.yandexbooks"
        minSdk 17
        targetSdk 19
        versionCode 29
        versionName "1.4.6"

        ndk {
            abiFilters 'armeabi-v7a', 'armeabi'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Conscrypt - Google BoringSSL for TLS 1.2 / TLS 1.3 on Android 4.2+
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    // OkHttp 3.12.x - Final LTS release supporting Android 4.0+ (API 14-19)
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // ZXing Core for fast offline QR code generation on E-Ink
    implementation 'com.google.zxing:core:3.4.1'

    // AndroidX Annotations
    implementation 'androidx.annotation:annotation:1.2.0'
}
